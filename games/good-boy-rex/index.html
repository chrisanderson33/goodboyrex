function regionAt(x,y){ if(!inb(x,y)) return R.SEA; return reg[I(x,y)]; }
function setGround(x,y,g){ if(inb(x,y)) ground[I(x,y)]=g; }
function clearSpot(x,y,r,regFrom){
  const cr=regFrom!=null?regFrom:reg[I(x,y)];
  for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++){
    if(!inb(xx,yy)||Math.hypot(xx-x,yy-y)>r+.5) continue; const i=I(xx,yy);
    if(obj[i]===O.HOUSE||obj[i]===O.BLOCK) continue;
    if(reg[i]===R.SEA){ reg[i]=cr===R.SEA?R.MEADOW:cr; ground[i]=REGIONS[reg[i]].ground; }
    if(GSOLID[ground[i]]) ground[i]=REGIONS[reg[i]].ground;
    obj[i]=O.NONE;
  }
}
function carveTile(x,y,trail){
  if(!inb(x,y)) return; const i=I(x,y);
  if(obj[i]===O.HOUSE||obj[i]===O.BLOCK) return;
  const r=reg[i];
  if(GWATER[ground[i]]||ground[i]===G.LAVA){ ground[i]=G.BRIDGE; obj[i]=O.NONE; return; }
  if(ground[i]===G.BRIDGE){ obj[i]=O.NONE; return; }
  if(r===R.FORTRESS||r===R.KEEP){ if(GSOLID[ground[i]]) ground[i]=REGIONS[r].ground; obj[i]=O.NONE; return; }
  ground[i]=trail?REGIONS[r].ground:(r===R.HAUNTED?THEMES[themeAt(x)].path:REGIONS[r].path); obj[i]=O.NONE;
}
function carveLine(a,b,rad,wob,trail){
  const [x0,y0]=a,[x1,y1]=b, len=Math.hypot(x1-x0,y1-y0)||1, steps=Math.ceil(len*2);
  const horiz=Math.abs(x1-x0)>=Math.abs(y1-y0);
  for(let s=0;s<=steps;s++){
    const t=s/steps; let x=x0+(x1-x0)*t, y=y0+(y1-y0)*t;
    if(wob){ const n=(vnoise(x*.12,y*.12,99)-.5)*wob*Math.sin(Math.PI*t); x+=-(y1-y0)/len*n; y+=(x1-x0)/len*n; }
    const cx=Math.round(x), cy=Math.round(y);
    for(let oy=-rad;oy<=rad;oy++)for(let ox=-rad;ox<=rad;ox++){
      const tx=cx+ox,ty=cy+oy; if(!inb(tx,ty)) continue;
      const wasWater=GWATER[ground[I(tx,ty)]]||ground[I(tx,ty)]===G.LAVA;
      carveTile(tx,ty,trail);
      if(wasWater) oVar[I(tx,ty)]=horiz?1:0;
    }
  }
}
function addStruct(k,x,y,w,h,extra){
  const s=Object.assign({k,x,y,w,h},extra||{}); structs.push(s); if(!s.flat)
  for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){ if(inb(xx,yy)){ const i=I(xx,yy); obj[i]=s.solidObj||O.BLOCK; if(GSOLID[ground[i]]) ground[i]=REGIONS[reg[i]].ground; } }
  return s;
}
function buildBridge(){
  for(let y=23;y<=36;y++)for(let x=95;x<=97;x++){ const i=I(x,y); if(GWATER[ground[i]]||ground[i]===G.BRIDGE){ ground[i]=G.BRIDGE; oVar[i]=0; obj[i]=O.NONE; } }
  floodReach(); buildMinimap();
}

function genWorld(){
  const rnd=mulberry(20261103);
  const seeds=[[R.MEADOW,96,96],[R.MEADOW,100,66],[R.MEADOW,76,110],[R.MEADOW,116,88],[R.MEADOW,96,44],[R.MEADOW,112,108],
    [R.WOODS,36,80],[R.WOODS,48,100],[R.WOODS,28,62],[R.WOODS,58,84],[R.WOODS,22,96],
    [R.SHORE,150,110],[R.SHORE,172,92],[R.SHORE,128,128],[R.SHORE,160,124],[R.SHORE,140,104],
    [R.PEAKS,44,32],[R.PEAKS,70,30],[R.PEAKS,24,48],[R.PEAKS,56,48],
    [R.CAVERNS,150,40],[R.CAVERNS,170,62],[R.CAVERNS,126,36],[R.CAVERNS,136,52]];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const i=I(x,y);
    const dx=(x-96)/92, dy=(y-78)/66;
    const d=Math.sqrt(dx*dx+dy*dy)+(fbm(x*.07,y*.07,3)-.44)*.45;
    let land=d<.92;
    if(y<34&&Math.abs(x-96)<26) land=false;
    const ix=(x-96)/15, iy=(y-15)/9;
    if(ix*ix+iy*iy<1){ reg[i]=R.FORTRESS; ground[i]=G.SAWDUST; continue; }
    if(!land){ reg[i]=R.SEA; ground[i]=G.DEEP; continue; }
    const px=x+(fbm(x*.05,y*.05,5)-.44)*18, py=y+(fbm(x*.05,y*.05,6)-.44)*18;
    let best=1e9,br=R.MEADOW;
    for(const s of seeds){ const dd=(px-s[1])**2+(py-s[2])**2; if(dd<best){best=dd;br=s[0];} }
    if(Math.hypot(x-96,y-100)<15||mkE(x,y,1.5)<1) br=R.VILLAGE;
    if(Math.hypot(x-74,y-114)<8) br=R.KEEP;
    reg[i]=br; ground[i]=REGIONS[br].ground;
  }
  // region features
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    const i=I(x,y), r=reg[i], h=hash(x,y,77);
    if(r===R.MEADOW){
      if(fbm(x*.1,y*.1,11)>.63){ground[i]=G.WATER;continue;}
      const t=fbm(x*.13,y*.13,41);
      if(t>.55&&h<.55) obj[i]=O.TREE; else if(h<.012) obj[i]=O.ROCK; else if(h<.07) obj[i]=O.FLOWER; else if(fbm(x*.2,y*.2,43)>.55) obj[i]=O.TALL;
    } else if(r===R.WOODS){
      if(fbm(x*.1,y*.1,13)>.65){ground[i]=G.WATER;continue;}
      const t=fbm(x*.2,y*.2,31);
      if(t>.45||h<.06) obj[i]=O.TREE; else if(h<.1) obj[i]=O.MUSH; else if(h<.2) obj[i]=O.TALL;
    } else if(r===R.SHORE){
      if(h<.03) obj[i]=O.PALM; else if(h<.045) obj[i]=O.ROCK; else if(h<.08) obj[i]=O.SHELL;
    } else if(r===R.PEAKS){
      if(fbm(x*.12,y*.12,23)>.58) ground[i]=G.ICE;
      const t=fbm(x*.18,y*.18,21);
      if(ground[i]!==G.ICE&&(t>.48||h<.04)) obj[i]=O.PINE; else if(h<.065) obj[i]=O.ROCK;
    } else if(r===R.CAVERNS){
      const c=fbm(x*.14,y*.14,51), l=fbm(x*.11,y*.11,53);
      if(l>.6) ground[i]=G.LAVA; else if(c>.53) ground[i]=G.CLIFF; else if(h<.04) obj[i]=O.ROCK; else if(h<.12) obj[i]=O.EMBER;
    } else if(r===R.VILLAGE){
      if(h<.06) obj[i]=O.FLOWER;
    }
  }
  // village: plaza, fence, houses, shrine
  const [vx,vy]=LOC.village;
  for(let y=vy-16;y<=vy+16;y++)for(let x=vx-16;x<=vx+16;x++){
    const d=Math.hypot(x-vx,y-vy), i=I(x,y);
    if(d<4.6){ ground[i]=G.STONE; obj[i]=O.NONE; }
    if(d>=12.5&&d<13.5&&reg[i]===R.VILLAGE&&!inMarket(x,y)){ obj[i]=O.FENCE; ground[i]=G.GRASS; }
  }
  // Market Street fence: every tile just outside the street's block
  for(let y=MARKET.cy-12;y<=MARKET.cy+12;y++)for(let x=MARKET.cx-17;x<=MARKET.cx+17;x++){ const i=I(x,y);
    if(reg[i]!==R.VILLAGE||inMarket(x,y)||Math.hypot(x-vx,y-vy)<12.5) continue;
    if([[1,0],[-1,0],[0,1],[0,-1]].some(([ox,oy])=>inMarket(x+ox,y+oy))){ obj[i]=O.FENCE; ground[i]=G.GRASS; } }
  // keep ruins
  const [kx,ky]=LOC.keep;
  for(let y=ky-8;y<=ky+8;y++)for(let x=kx-8;x<=kx+8;x++){
    const d=Math.hypot(x-kx,y-ky), i=I(x,y); if(!inb(x,y)) continue;
    if(d<6.5){ ground[i]=G.STONE; obj[i]=O.NONE; }
    if(d>=5.5&&d<6.5&&hash(x,y,5)>.3) ground[i]=G.WALL;
    if(d<5.5&&hash(x,y,6)<.05) obj[i]=O.ROCK;
  }

const SPR={};
function genObjects(){
  const tree=(dark,v)=>mk(20,30,g=>{
    const r=mulberry(500+v*7+(dark?50:0));
    const c=dark?['#0e2a1e','#18442e','#24603c','#36804a']:['#1f4a22','#337a30','#4b9c3e','#73c057'];
    rect(g,8,19,4,10,'#6a4426'); rect(g,8,19,1,10,'#3a2414'); rect(g,11,19,1,10,'#3a2414'); rect(g,9,20,1,8,'#8a5a32'); rect(g,7,28,6,1,'#3a2414');
    for(let y=0;y<24;y++)for(let x=0;x<20;x++){
      const d=Math.hypot(x-9.5,(y-10.5)*1.08)+(r()-.5)*1.4;
      if(d<9.8){ let col; if(d>8.7) col=c[0]; else { const l=(9.5-x)*.35+(10.5-y)*.45+(r()-.5)*2.2; col=c[l>3.2?3:l>-.5?2:1]; } rect(g,x,y,1,1,col); }
    }

  });
  SPR.tree=[0,1,2,3].map(v=>tree(false,v)); SPR.treeDark=[0,1,2,3].map(v=>tree(true,v));
  SPR.pine=[0,1,2].map(v=>mk(18,32,g=>{
    const r=mulberry(600+v); rect(g,7,26,4,6,'#5a3a22'); rect(g,7,26,1,6,'#2e1c10');
    const layers=[[3,8],[9,12],[16,16]];

  }));
  SPR.palm=[0,1].map(v=>mk(24,34,g=>{
    for(let y=8;y<32;y++){ const x=10+Math.round(Math.sin((y-8)/24*1.6)*(v?-3:3)); rect(g,x,y,4,1,y%3?'#a07040':'#7a5028'); rect(g,x,y,1,1,'#5a3818'); }
    const cx=12+(v?-2:2), cy=9; const fr=[[-11,3],[-8,-4],[0,-8],[8,-4],[11,3],[5,6],[-5,6]];
    fr.forEach(([dx,dy])=>{ for(let t=0;t<=1;t+=.06){ const x=cx+dx*t, y=cy+dy*t+Math.sin(t*3)*2*(t); rect(g,x|0,y|0,2,2,t>.7?'#4aa040':'#2e7a2e'); rect(g,x|0,(y|0)+2,1,1,'#1e5a22'); } });
    rect(g,cx-2,cy-1,4,3,'#6a4a20'); rect(g,cx-1,cy+1,2,2,'#8a6a30');
  }));
  const rock=(base,hi,lo,cap)=>mk(16,14,g=>{
    for(let y=0;y<14;y++)for(let x=0;x<16;x++){ const d=Math.hypot((x-7.5)/7.6,(y-8)/6); if(d<1){ let c=d>.86?'#1e1a1a':((x+y)<12?hi:(x+y>18?lo:base)); rect(g,x,y,1,1,c);} }
    if(cap){ rect(g,3,2,10,2,'#f4f8ff'); rect(g,5,1,6,1,'#f4f8ff'); }
  });
  SPR.rock=rock('#8a8a96','#aeaeba','#6a6a76'); SPR.rockSnow=rock('#8a8a96','#aeaeba','#6a6a76',true); SPR.rockDark=rock('#3e3434','#5a4c48','#2a2222');

// decor drawn in ground pass
function drawDecor(o,x,y,v,i){
  if((o===O.PUMPKIN||o===O.MUSH)&&i!=null&&reg[i]===R.HAUNTED){ const th=themeAt(i%MW); if(th!=='fall'){ drawThemeDecor(o,th,x,y,v); return; } }
  switch(o){
    case O.FLOWER: { const cols=['#f04a5a','#f8e040','#f0f0ff','#c070f0']; const c=cols[v%4];
      for(const [dx,dy] of [[3,4],[10,9]]){ rect(ctx,x+dx,y+dy-1,1,1,c);rect(ctx,x+dx-1,y+dy,1,1,c);rect(ctx,x+dx+1,y+dy,1,1,c);rect(ctx,x+dx,y+dy+1,1,1,c);rect(ctx,x+dx,y+dy,1,1,'#f8d040'); } break; }
    case O.TALL: for(const [dx,dy] of [[2,6],[6,3],[10,8],[12,2],[4,11]]){ rect(ctx,x+dx,y+dy,1,3,'#3e8a32'); rect(ctx,x+dx+1,y+dy+1,1,3,'#6ab84e'); rect(ctx,x+dx-1,y+dy+1,1,2,'#2e6a26'); } break;
    case O.MUSH: rect(ctx,x+6,y+8,4,2,'#d84040'); rect(ctx,x+5,y+9,6,1,'#d84040'); rect(ctx,x+7,y+8,1,1,'#fff'); rect(ctx,x+7,y+10,2,3,'#f0e8d0'); break;
    case O.SHELL: rect(ctx,x+5,y+9,4,2,'#f8c8c0'); rect(ctx,x+6,y+8,2,1,'#f8c8c0'); rect(ctx,x+6,y+9,1,2,'#e0a098'); rect(ctx,x+11,y+4,2,1,'#fff'); break;
    case O.KELP: for(let k=0;k<3;k++){ const bx=x+3+k*5; for(let yy=0;yy<12;yy++){ const ox=Math.round(Math.sin((yy+T*4+k*2)/3)*1.5); rect(ctx,bx+ox,y+3+yy,1,1,yy%3?'#3a9a5a':'#5ac07a'); } } break;
    case O.PUMPKIN: rect(ctx,x+4,y+8,8,6,'#e87a20'); rect(ctx,x+3,y+9,10,4,'#e87a20'); rect(ctx,x+7,y+8,1,6,'#c05a10'); rect(ctx,x+7,y+6,2,2,'#4a7a2a');
      if(v%3===0){ const on=((T*4+v)|0)%5?'#ffe060':'#ffb030'; rect(ctx,x+5,y+10,2,1,on); rect(ctx,x+9,y+10,2,1,on); rect(ctx,x+6,y+12,4,1,on); } break;
    case O.WARP: { const r=reg[i]; if(r===R.GROTTO){ ctx.globalAlpha=.3+.1*Math.sin(T*3); rect(ctx,x+2,y-24,12,40,'#e0f4ff'); ctx.globalAlpha=1; rect(ctx,x+5,y+2,6,12,'#2a4a6a'); for(let k=0;k<4;k++) rect(ctx,x+5,y+3+k*3,6,1,'#8a6a40'); }
      else if(r===R.INTERIOR){ rect(ctx,x+1,y+4,14,10,'#7a2a2a'); rect(ctx,x+2,y+5,12,8,'#a84a3a'); for(let k=0;k<3;k++) rect(ctx,x+3,y+6+k*3,10,1,'#d8a060'); } break; }
    case O.EMBER: { const on=((T*3+v)|0)%3===0; rect(ctx,x+(v*5%12),y+(v*7%12),2,1,on?'#f8b040':'#c8501e'); rect(ctx,x+(v*9%12)+2,y+(v*3%12)+3,1,1,'#f07020'); break; }
  }
}

const structCache=new Map();
function houseSprite(s){
  const key='h'+s.x+','+s.y; if(structCache.has(key)) return structCache.get(key);
  const W=s.w*16, Hh=s.h*16+8;
  const c=mk(W+4,Hh,g=>{
    const ox=2, wallTop=Hh-30;
    rect(g,ox,wallTop,W,30,'#3a2414'); rect(g,ox+1,wallTop,W-2,29,s.wall);
    for(let y=wallTop+4;y<Hh-1;y+=5) rect(g,ox+1,y,W-2,1,shade(s.wall,-.12));
    // roof
    for(let y=0;y<wallTop+4;y++){ const inset=Math.max(0,4-y); rect(g,ox-2+inset,y,W+4-inset*2,1,y%4===3?shade(s.roof,-.25):(y<2?shade(s.roof,.25):s.roof)); }

function talkTo(n){
  { const [nx,ny]=npcPos(n.id); P.dir = Math.abs(nx-P.x)>Math.abs(ny-P.y) ? (nx>P.x?3:2) : (ny>P.y?0:1); if(n.walker){ n.vx=n.vy=0; n.wt=1.5; n.face=nx>P.x?2:3; } }

    const lines=(q.type==='deliver'?[['','You hand over the '+q.item+'.']]:[]).concat(q.done.map(t=>Array.isArray(t)?t:[n.name,t]));
    say(lines,()=>{ completeQuest(q); if(n.ride) openRide(n); }); return; } }
  if(n.id==='coach'){ coachTalk(); return; }
  // main story
  if(n.id==='elder'&&storyElder()) return;
  if(n.shop){ say([[n.name,"Welcome to Bonnie's Bone Shop! Take a look."]],()=>{ talkQuests(n,true)||openShop(); }); return; }
  if(n.armory){ if(talkQuests(n,true)) return; say([[n.name,ownedItems().length?"Back for more gear, Rex? Take a look.":"Welcome to Ironpaw's Armory! Every hero needs something for the hamsters you can't reach with a bite."]],openArmory); return; }
  if(n.inn){ say([[n.name,"Welcome to the Sleepy Bone Inn, Rex! You look tired."]],openInn); return; }
  if(n.tailor){ if(talkQuests(n,true)) return; say([[n.name,"Welcome to my little workshop! Care for a new look?"]],openTailor); return; }
  if(n.petkeeper){ if(talkQuests(n,true)) return; say([[n.name,"Hello, Rex! Want to pick a friend to come adventuring with you?"]],openPetMenu); return; }
  if(n.ride){ if(QUESTS.some(q=>q.giver===n.id&&S.q[q.id]&&S.q[q.id].st==='ready')){ talkQuests(n,true); return; } say([[n.name,n.ride==='sky'?"Fancy a balloon ride up to Cloudtop Isle? It's free for heroes!":"Ready to float back down to Frostpaw Peaks?"]],()=>openRide(n)); return; }
  if(talkQuests(n,false)) return;
  if(n.walker&&WALKERS[n.id]){ say([[n.name,n.chat[n.ci%n.chat.length]]]); n.ci++; return; }
  say([[n.name,n.chat[(Math.random()*n.chat.length)|0]]]);
}
function talkQuests(n,afterShop){
  for(const q of QUESTS){ if(q.giver!==n.id) continue; const st=S.q[q.id];
    if(st&&st.st==='ready'){ say(q.done.map(t=>Array.isArray(t)?t:[n.name,t]),()=>completeQuest(q)); return true; }
    if(st&&st.st==='active'){
      if(q.type==='pay'){ if(S.bones>=q.amount){ S.bones-=q.amount; say([['','You give '+q.amount+' bones.']].concat(q.done.map(t=>Array.isArray(t)?t:[n.name,t])),()=>completeQuest(q)); }
        else say([[n.name,q.prog],['','(You have '+S.bones+' bones.)']]); return true; }
      if(!afterShop){ say([[n.name,q.prog]]); return true; }
    }
  }
  for(const q of QUESTS){ if(q.giver!==n.id||!questAvail(q)) continue;
    say(q.offer.map(t=>Array.isArray(t)?t:[n.name,t]).concat([['','Quest: '+q.title+'. Reward: '+rewardText(q.rw)+'.']]),()=>acceptQuest(q)); return true; }

function freeP(x,y){ const hw=5,hh=6; return !solidAt(x-hw,y-hh)&&!solidAt(x+hw,y-hh)&&!solidAt(x-hw,y)&&!solidAt(x+hw,y)&&(!npcAt(x,y)||!!npcAt(P.x,P.y)); }
function moveP(dx,dy){

function updatePlayer(dt){

function updateProj(dt){
  for(const p of projs){
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.bark){ p.r+=dt*26;
      for(const e of enemies){ if(e.dead||p.hits.has(e)) continue; const rr=(e.boss?18:9)+p.r; if(Math.hypot(e.x-p.x,(e.y-(e.boss?10:5))-p.y)<rr){ p.hits.add(e); damageEnemy(e,barkDmg(),P.x,P.y,260,'bark');} }
      for(const q of projs){ if(q.enemy&&Math.hypot(q.x-p.x,q.y-p.y)<p.r+4) q.life=0; }
      if(solidAt(p.x,p.y+4)&&p.life<.45) p.life=Math.min(p.life,.05);
    } else if(p.feather){
      for(const e of enemies){ if(e.dead||e.dummy) continue; if(Math.hypot(e.x-p.x,(e.y-(e.boss?10:5))-p.y)<(e.boss?16:8)){ damageEnemy(e,p.dmg,p.x-p.vx*.05,p.y-p.vy*.05,60,'pet'); p.life=0; break; } }
      if(solidAt(p.x,p.y+6)) p.life=0;
    } else if(p.pebble){
      for(const e of enemies){ if(e.dead) continue; if(Math.abs(e.x-p.x)<(e.boss?16:e.dummy?10:8)&&Math.abs((e.y-(e.boss?10:e.dummy?10:5))-p.y)<(e.boss?18:10)){ damageEnemy(e,p.dmg,p.x-p.vx*.1,p.y-p.vy*.1,110,'sling'); p.life=0; break; } }
      if(p.life>0&&solidAt(p.x,p.y+6)){ p.life=0; for(let i=0;i<3;i++) parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*50,vy:-Math.random()*40,life:.25,c:'#b0b0bc',s:1}); }
    } else if(p.boomer){
      p.t+=dt;
      if(p.out&&(p.t>.42||solidAt(p.x,p.y+6))){ p.out=false; p.hits=new Set(); }
      if(!p.out){ const dx=P.x-p.x, dy=(P.y-8)-p.y, d=Math.hypot(dx,dy)||1, sp=Math.min(270,120+p.t*220); p.vx=dx/d*sp; p.vy=dy/d*sp; if(d<12) p.life=0; }
      for(const e of enemies){ if(e.dead||p.hits.has(e)) continue; if(Math.hypot(e.x-p.x,(e.y-(e.boss?10:5))-p.y)<(e.boss?20:11)){ p.hits.add(e); damageEnemy(e,p.dmg,p.x-p.vx*.1,p.y-p.vy*.1,150,'boom'); } }
      for(const q of projs){ if(q.enemy&&Math.hypot(q.x-p.x,q.y-p.y)<8) q.life=0; }
    } else if(p.bomb){
      p.t+=dt; const ft=.38;
      if(p.t<ft){ const k=p.t/ft; p.x=p.sx+(p.tx-p.sx)*k; p.y=p.sy+(p.ty-p.sy)*k; p.z=Math.sin(Math.PI*k)*16; } else p.z=0;
      if(p.t>=p.fuse){ p.life=0; explodeBomb(p); }
      else if(Math.random()<.5) parts.push({x:p.x+2,y:p.y-9-p.z,vx:(Math.random()-.5)*20,vy:-20-Math.random()*20,life:.25,c:Math.random()<.5?'#ffd84a':'#ff8a3a',s:1});
    } else if(p.enemy){
      if(solidAt(p.x,p.y+6)) p.life=0;
      if(P.inv<=0&&Math.abs(p.x-P.x)<6&&Math.abs(p.y-(P.y-6))<7){ p.life=0; hurtPlayer(p.dmg,p.x-p.vx,p.y-p.vy); }
    }
  }
  projs=projs.filter(p=>p.life>0);
}
function updatePickups(dt){
  for(const p of pickups){
    p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.9; p.vy*=.9;
    const d=Math.hypot(P.x-p.x,(P.y-4)-p.y);
    if(d<40&&p.t>.4){ p.x+=(P.x-p.x)/d*140*dt; p.y+=((P.y-4)-p.y)/d*140*dt; }
    if(d<9&&p.t>.25){ p.got=true; if(p.k==='bone'){ S.bones++; SFX.coin(); } else if(p.k==='heart'){ S.hp=Math.min(S.maxHp,S.hp+2); SFX.heal(); } }
    if(p.t>25) p.got=true;
  }
  pickups=pickups.filter(p=>!p.got);
  // quest items
  for(const q of QUESTS){ const st=S.q[q.id]; if(!st||st.st!=='active'||!st.items) continue;
    for(let k=st.items.length-1;k>=0;k--){ const [x,y]=st.items[k]; if(Math.hypot(P.x-(x*16+8),(P.y-4)-(y*16+8))<12){ st.items.splice(k,1); SFX.coin(); toast('Got '+q.item+'!'+(q.count>1?' ('+(q.count-st.items.length)+'/'+q.count+')':''),'#9ad8ff'); checkQuestTick(); save(); } } }
}
function updateParts(dt){

let lastHit=0;
function update(dt){
  if(codeOpen){ T+=dt; clearPressed(); return; }
  T+=dt; shake=Math.max(0,shake-dt);
  if(hit('mute')){ musicOn=!musicOn; saveSettings(); toast(musicOn?'Music on':'Music off'); }
  switch(mode){
    case 'title': updateTitle(); break;
    case 'play':
      if(warpFx){ updateWarp(dt); break; }
      if(coachRun) updateCoachRun(dt);
      updateWalkers(dt);
      if(elderRun) updateElderRun(dt);
      if(whiskersFlee){ whiskersFlee.t+=dt; whiskersFlee.y-=110*dt; whiskersFlee.x-=20*dt; if(whiskersFlee.t>1.4) whiskersFlee=null; }
      updatePlayer(dt);
      if(mode!=='play') break;
      updateEnemies(dt); enemies=enemies.filter(e=>!e.dead); separateEnemies(dt);
      updateProj(dt); updatePickups(dt); spawnTick(dt); checkBossTriggers(); checkNamedSpawns(); checkQuestTick(); tickClock(dt); tutUpdate(dt); updatePet(dt); updateHazards(dt); checkOptBosses(); zoneAmbience(dt); updateLabRise(dt);
      if(S.main>=6&&!bossActive&&Math.hypot(P.x-LOC.throne[0]*16,P.y-LOC.throne[1]*16)<9*16) {}
      saveT+=dt; if(saveT>15){ saveT=0; save(); }
      if(mode==='play'){ if(hit('log')){ mode='log'; logChooser=false; logSel=0; if(tutActive()) tutT.log=true; } else if(hit('map')){ mode='map'; if(tutActive()) tutT.map=true; } else if(hit('pause')) openPause(); else if(hit('travel')) openTravel(); }
      break;
    case 'dialog': updateDialog(dt); break;
    case 'menu': updateMenu(); break;
    case 'log': updateLog(); break;
    case 'map': if(hit('travel')) openTravel(); else if(hit('map')||hit('pause')||confirmHit()||hit('log')) mode='play'; break;
    case 'pause': updatePause(); break;
    case 'dead': deadT+=dt; if(deadT>1.2&&confirmHit()) respawn(); break;
    case 'ending': endT+=dt; if(endT>4&&confirmHit()){ mode='play'; playTrack('town'); toast('Thanks for playing! Keep exploring.','#ffd84a'); } break;
  }
  updateParts(dt);
  const pz=mode==='pause'||mode==='map'; if(document.body.classList.contains('paused')!==pz) document.body.classList.toggle('paused',pz);
  clearPressed();
}

// ---------- zones, routing and warps ----------
function zoneOf(tx,ty){ if(!inb(tx,ty)) return 0; const i=I(tx,ty); if(room[i]) return room[i]; const r=reg[i]; return r===R.GROTTO?'g':r===R.SKY?'s':0; }
const pZone=()=>zoneOf(Math.floor(P.x/16),Math.floor((P.y-2)/16));
function zoneName(z){ return z==='g'?'the Coral Grotto':z==='s'?'Cloudtop Isle':ROOMS[z]?ROOMS[z].name:'the island'; }
function routeTarget(tg){
  if(!tg) return null; const zt=zoneOf(Math.floor(tg[0]/16),Math.floor(tg[1]/16)), zp=pZone(); if(zt===zp) return tg;
  const px=p=>[p[0]*16+8,p[1]*16+8];
  if(zp!==0){ if(zp==='g') return px(LOC.grottoExit); if(zp==='s') return npcPos('fluff'); return px(ROOMS[zp].exit); }
  if(zt==='g') return px(LOC.caveMouth); if(zt==='s') return npcPos('puffy'); return px(ROOMS[zt].door);
}
function currentMusic(){ const tx=Math.floor(P.x/16), ty=Math.floor(P.y/16); const rm=inb(tx,ty)?room[I(tx,ty)]:0; if(rm) return ROOMS[rm].music; const r=regionAt(tx,ty); if(r===R.HAUNTED) return THEMES[themeAt(tx)].music; return REGIONS[r].music||'field'; }

function updateWarp(dt){
  warpFx.t+=dt;
  if(!warpFx.done&&warpFx.t>=.28){ warpFx.done=true;
    P.x=warpFx.to[0]*16+8; P.y=warpFx.to[1]*16+12; P.dir=warpFx.dir; P.kbt=0; P.dashT=0;
    if(bossActive){ enemies=enemies.filter(e=>!e.boss&&!e.minion); bossActive=null; }
    enemies=enemies.filter(e=>e.dummy||e.named); projs=[]; hazards=[];
    PET.x=P.x-10; PET.y=P.y+4; P.lastTile=Math.floor((P.y-3)/16)*MW+Math.floor(P.x/16); curRegion=-1; save(); }
  if(warpFx.t>=.56){ const a=warpFx.after; warpFx=null; if(a) a(); }
}
function checkWarp(){
  const wtx=Math.floor(P.x/16), wty=Math.floor((P.y-3)/16), wk=wty*MW+wtx;
  if(wk===P.lastTile) return; P.lastTile=wk; const w=WARPS[wk]; if(!w||warpFx) return;

      if(P.inv<=0&&Math.hypot(P.x-h.x,(P.y-4)-h.y)<h.r+4) hurtPlayer(h.dmg,h.x,h.y); } }

// ---------- companions ----------
function petSprite(k){ const p=PETS[k]; if(!p.spr) p.spr=npcSprite(p.npc?NPCBY[p.npc]:p.def); return p.spr; }
function setPet(k){ S.pet=k; PET.x=P.x-10; PET.y=P.y+4; PET.atk=1; }
const petDmg=()=>1+Math.floor(S.lvl/3);
function updatePet(dt){
  if(!S.pet||!PETS[S.pet]) return; const p=PETS[S.pet]; PET.atk-=dt;
  let tgt=null, bd=1e9;
  if(p.kind!=='heal') for(const e of enemies){ if(e.dummy||e.dead||(e.alpha!=null&&e.alpha<.45)) continue; if(Math.hypot(e.x-P.x,e.y-P.y)>110) continue; const d2=Math.hypot(e.x-PET.x,e.y-PET.y); if(d2<bd){bd=d2;tgt=e;} }

  const side=P.dir===2?1:-1, gx=melee?tgt.x:P.x+(P.dir===3?-20:P.dir===2?20:side*-18), gy=melee?tgt.y:P.y+(P.dir===0?-8:P.dir===1?10:3);
  const dx=gx-PET.x, dy=gy-PET.y, d=Math.hypot(dx,dy);
  const pz=zoneOf(Math.floor(PET.x/16),Math.floor(PET.y/16));
  if(d>260||pz!==pZone()){ PET.x=P.x-10; PET.y=P.y+4; }
  else if(d>(melee?8:10)){ const sp=Math.min(d*5,p.spd*(d>60?1.7:1)); PET.x+=dx/d*sp*dt; PET.y+=dy/d*sp*dt; PET.anim+=dt*8; PET.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?0:1); }
  if(tgt&&PET.atk<=0){
    if(p.kind==='shoot'){ if(bd<140){ const a=Math.atan2(tgt.y-6-(PET.y-14),tgt.x-PET.x); projs.push({feather:true,x:PET.x,y:PET.y-14,vx:Math.cos(a)*180,vy:Math.sin(a)*180,life:1,dmg:petDmg()}); PET.atk=1.2; SFX.shoot(); } }
    else if(Math.hypot(tgt.x-PET.x,tgt.y-PET.y)<15){ damageEnemy(tgt,petDmg()+(p.kind==='scratch'?1:0),PET.x,PET.y,110,'pet'); PET.atk=p.kind==='scratch'?.8:1;
      for(let k=0;k<4;k++) parts.push({x:tgt.x,y:tgt.y-8,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60,life:.25,c:'#fff',s:1}); }
  }
  if(p.kind==='heal'){ PET.heal+=dt; if(PET.heal>9){ PET.heal=0; if(S.hp<S.maxHp){ S.hp=Math.min(S.maxHp,S.hp+1); SFX.heal(); floaters.push({x:P.x,y:P.y-20,t:'+',life:.8,c:'#8af08a'});
    for(let k=0;k<8;k++) parts.push({x:P.x+(Math.random()-.5)*14,y:P.y-6,vx:0,vy:-20-Math.random()*20,life:.7,c:'#c8f0ff',s:1,ng:true}); } } }
}

function rexSprite(key,fr){ const gold=S&&S.outfit==='golden'; const k='rex'+(gold?'g':'')+key+fr; if(!SPR[k]) SPR[k]=fromRows(REX[key].concat(REX_LEGS[key][fr]),gold?REX_GOLD:REX_PAL,16,16); return SPR[k]; }
function drawOutfit(o,key,behind){
  const K='#1a1a1a', c='#2a5ad0', d='#1a3a90';
  if(o==='cape'){ if(behind){ if(key==='down'){ rect(ctx,1,9,2,6,c); rect(ctx,13,9,2,6,c); } else if(key==='side'){ const f=((T*8)|0)%2; rect(ctx,0,8,4,6+f,c); rect(ctx,0,8,4,1,d); } }
    else if(key==='up'){ rect(ctx,3,10,10,6,c); rect(ctx,3,10,10,1,d); rect(ctx,3,15,10,1,d); } return; }
  if(behind) return;
  if(o==='pirate'){ if(key==='side'){ rect(ctx,8,0,7,3,'#222'); rect(ctx,7,3,9,1,'#111'); rect(ctx,11,1,2,1,'#fff'); } else { rect(ctx,3,0,10,3,'#222'); rect(ctx,2,3,12,1,'#111'); if(key==='down') rect(ctx,7,1,2,1,'#fff'); } }
  else if(o==='wizard'){ const cx=key==='side'?11:8; for(let r=0;r<6;r++) rect(ctx,cx-r,-4+r,1+r*2,1,'#5a3aa0'); rect(ctx,cx-6,2,13,1,'#3a2470'); rect(ctx,cx,-1,1,1,'#ffd84a'); rect(ctx,cx-2,1,1,1,'#ffd84a'); }
  else if(o==='ninja'){ if(key==='down'){ rect(ctx,3,5,10,1,K); rect(ctx,3,8,10,1,K); rect(ctx,2,5,1,4,K); rect(ctx,13,5,1,4,K); rect(ctx,14,6,2,1,K); }
    else if(key==='up'){ rect(ctx,3,6,10,2,K); rect(ctx,7,8,2,3,K); } else { rect(ctx,8,4,8,1,K); rect(ctx,8,7,7,1,K); rect(ctx,4,4,4,1,K); rect(ctx,3,5,2,1,K); } }
}

// ---------- menus for the new characters ----------
function openTailor(){
  const items=()=>Object.keys(OUTFITS).filter(k=>OUTFITS[k].price!=null||S.outfits[k]).map(k=>{ const o=OUTFITS[k];
    if(S.outfits[k]) return {label:(S.outfit===k?'* ':'')+'Wear '+o.name,pick(){ S.outfit=k; toast('Rex is wearing: '+o.name,'#ffd84a'); save(); }};
    return {label:o.name,price:o.price,act(){ S.outfits[k]=1; S.outfit=k; }}; }).concat([{label:'Leave',price:0,leave:true}]);
  menu={title:"Taylor's Tailoring",items:items(),sel:0,refresh:items,bye:['Taylor the Tailor','Stay stylish, Rex!']}; mode='menu';
}
function openPetMenu(){
  const un=Object.keys(PETS).filter(k=>S.pets[k]);
  if(!un.length){ say([['Nanny Noodle',"No friends are ready to join you yet. Help folks around the island and someone may want to tag along!"]]); return; }
  menu={title:'Choose a companion',choice:true,sel:0,items:un.map(k=>({label:(S.pet===k?'* ':'')+PETS[k].name+': '+PETS[k].desc,pick(){ setPet(k); toast(PETS[k].name+' is coming along!','#ffb0e0'); save(); }}))
    .concat([{label:'Go alone',pick(){ setPet(null); toast('Rex is adventuring solo.'); save(); }}])}; mode='menu';
}
function openRide(n){
  const toSky=n.ride==='sky';
  menu={title:toSky?'Fly to Cloudtop Isle?':'Fly back to Frostpaw Peaks?',choice:true,sel:0,items:[
    {label:toSky?'Yes, up we go!':'Yes, take me down',pick(){ warpTo(toSky?LOC.skyArrive:LOC.peaksBalloonArrive,0); }},
    ...(QUESTS.some(q=>q.giver===n.id&&(questAvail(q)||(S.q[q.id]&&S.q[q.id].st==='active')))?[{label:'Any jobs for me?',pick(){ talkQuests(n,false); }}]:[]),
    {label:'Not now',pick(){}}]}; mode='menu';
}
function normalizeState(){
  S.flags=S.flags||{}; if(S.main>=5&&!S.flags.labCalled){ S.flags.labCalled=1; if(!(S.bossDone||{}).drnibbles&&!S.q.drnibbles) S.q.drnibbles={st:'active',n:0}; }
  S.chests=S.chests||{}; S.chestsEver=S.chestsEver||{}; for(const k in S.chests){ S.chestsEver[k]=1; if(S.chests[k]<1e12) S.chests[k]=Date.now(); }
  S.pets=S.pets||{}; S.outfits=Object.assign({classic:1},S.outfits||{}); S.flags=S.flags||{}; if(S.diff==null) S.diff=1;
  if(!OUTFITS[S.outfit]) S.outfit='classic';
  for(const q of QUESTS){ if(q.rw.pet&&S.q[q.id]&&S.q[q.id].st==='done') S.pets[q.rw.pet]=1; if(q.rw.flag&&S.q[q.id]&&S.q[q.id].st==='done') S.flags[q.rw.flag]=1; }
  if(S.pet&&!S.pets[S.pet]) S.pet=null;
  S.gear=Object.assign({sling:0,boom:0,bombs:0,helmet:0},S.gear||{}); if(S.wsel&&!ownsItem(S.wsel)) S.wsel=null;
}
function askPause(q,yes,fn){ confirmBox={q,yes,fn}; pauseSel=1; }
function resetRun(){ setTimeout(syncItemButtons,0); enemies=[]; projs=[]; pickups=[]; hazards=[]; parts=[]; floaters=[]; toasts=[]; bossActive=null; warpFx=null; dlg=null; menu=null; whiskersFlee=null; coachRun=null; elderRun=null; banner=null; S=null; }
function toTitle(){ save(); hasSave=!!loadSave(); resetRun(); mode='title'; titleStage='main'; titleSel=0; playTrack('town'); }
function restartGame(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} memSave=null; hasSave=false; resetRun(); mode='title'; titleStage='diff'; titleSel=1; playTrack('town'); }
function pauseItems(){
  if(confirmBox) return [{l:confirmBox.yes,danger:true,a(){ const f=confirmBox.fn; confirmBox=null; f(); }},{l:'No, go back',a(){ confirmBox=null; pauseSel=0; }}];
  if(pausePage==='settings'){
    const outs=Object.keys(OUTFITS).filter(k=>S.outfits[k]); const pets=[null].concat(Object.keys(PETS).filter(k=>S.pets[k]));
    return [
      {l:'Music: '+(musicOn?'ON':'OFF'),c(){ musicOn=!musicOn; }},
      {l:'Sound effects: '+(sfxOn?'ON':'OFF'),c(){ sfxOn=!sfxOn; }},
      {l:'Volume: '+VOLS[volIdx]+'%',c(d){ volIdx=(volIdx+d+VOLS.length)%VOLS.length; applyVol(); }},
      {l:'Outfit: '+OUTFITS[S.outfit].name,c(d){ const i=outs.indexOf(S.outfit); S.outfit=outs[(i+d+outs.length)%outs.length]; }},
      {l:'Companion: '+(S.pet?PETS[S.pet].name:'None'),c(d){ if(pets.length<2){ toast('No companions yet. Help villagers to make friends!'); return; } const i=pets.indexOf(S.pet); setPet(pets[(i+d+pets.length)%pets.length]); }},
      {l:'Difficulty: '+DIFF[S.diff].name,c(d){ S.diff=(S.diff+d+3)%3; }},
      {l:'Save code',a(){ openSaveCode(); }},
      {l:'Controls',a(){ say([['Controls','Move: WASD / Arrows. Run: hold Shift.'],['Controls','Bite: J or Space. Bark: K. Dash: L or C (once Coach Corgi teaches you).'],['Controls','Talk / open chests: E or Enter. Walk into doors to go inside.'],['Controls',"Use gear: F. Switch gear: G. Buy gear at Ironpaw's Armory on Market Street (east Barkton)."],['Controls','Fast travel: T (or click a blue flag on the map).'],['Controls','Eat treat: H. Quest log: Q. Map: M. Music: N. Pause: Esc or the pause button.'],['Controls','On touch screens: drag the left side to move and use the buttons on the right.']]); }},
      {l:'< Back',a(){ pausePage='main'; pauseSel=5; }},
    ];
  }
  return [
    {l:'Resume',a(){ mode='play'; }},
    {l:'Save game',a(){ save(); hasSave=true; toast('Game saved!','#8af08a'); mode='play'; }},
    {l:'Quest log',a(){ mode='log'; logSel=0; }},
    {l:'Map',a(){ mode='map'; }},
    {l:'Fast travel',a(){ openTravel(); }},
    {l:'Settings >',a(){ pausePage='settings'; pauseSel=0; }},
    {l:'Load last save',a(){ if(!loadSave()){ toast('There is no saved game yet.','#ff9a9a'); return; } askPause('Load your last save? Anything since then will be lost.','Yes, load it',()=>{ startGame(false); toast('Loaded your last save.','#8af08a'); }); }},
    {l:'Return to title',a(){ askPause('Go back to the title screen? Your game will be saved first.','Yes, save and quit',toTitle); }},
    {l:'Restart game',danger:true,a(){ askPause('Start over from the very beginning? This erases your saved game.','Yes, erase and restart',restartGame); }},
  ];

}

// =====================================================================
//  DAY AND NIGHT — 10 minute loop: 6 minutes of day, 4 minutes of night

const DAY_LEN=360, NIGHT_LEN=240, CYCLE=DAY_LEN+NIGHT_LEN, FADE=30;
const isNight=()=>S&&S.clock>=DAY_LEN;
function darkness(){ if(!S) return 0; const c=S.clock;
  if(c<DAY_LEN-FADE) return 0; if(c<DAY_LEN) return (c-(DAY_LEN-FADE))/FADE; if(c<CYCLE-FADE) return 1; return 1-(c-(CYCLE-FADE))/FADE; }
function tickClock(dt){
  const was=isNight(); S.clock=((S.clock||0)+dt)%CYCLE; const now=isNight();
  if(now!==was) toast(now?'Night falls... stay close to the light!':'Good morning, Rex! The sun is up.',now?'#9ab0ff':'#ffd84a');
}
let nightCv=null, nightG=null;
function renderNight(pz){

//  TOWNSFOLK: spread-out quest givers and wandering chatters
// =====================================================================
const SPREAD=['nutty','hoot','fern','rusty','shelly','shellby','sandy','gus','mitts','pemberton','frost','purl','dig','rocky'];
function spreadQuestGivers(){
  const rnd=mulberry(4242), placed=[];
  const avoid=Object.values(BOSSES).filter(b=>b.arena).map(b=>b.arena).concat(MAIN.filter(m=>m.at).map(m=>m.at));
  for(const id of SPREAD){ const n=NPCBY[id], r=reg[I(n.x,n.y)], hub=REGIONS[r].hub; let best=null;
    for(let tries=0;tries<5000&&!best;tries++){
      const a=rnd()*Math.PI*2, d=7+rnd()*15, x=Math.round(hub[0]+Math.cos(a)*d), y=Math.round(hub[1]+Math.sin(a)*d);
      if(!inb(x,y)) continue; const i=I(x,y); if(reg[i]!==r||!reach[i]) continue;
      let ok=true; for(let oy=-1;oy<=1&&ok;oy++)for(let ox=-1;ox<=1;ox++){ const j=I(x+ox,y+oy); if(GSOLID[ground[j]]||OSOLID[obj[j]]||obj[j]===O.WARP||!reach[j]){ ok=false; break; } }
      if(!ok) continue;
      if(placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<9)) continue;
      if(NPCS.some(m=>!SPREAD.includes(m.id)&&Math.hypot(m.x-x,m.y-y)<5)) continue;
      if(avoid.some(p=>Math.hypot(p[0]-x,p[1]-y)<9)) continue;
      if(QUESTS.some(q=>q.at&&Math.hypot(q.at[0]-x,q.at[1]-y)<3)) continue;
      best=[x,y]; }
    if(best){ n.x=best[0]; n.y=best[1]; }
    placed.push([n.x,n.y]); }
}
// how townsfolk stroll: speed in pixels per second (Rex walks at 76), how many tiles from home they roam, how often they stop
const WALK={speed:44,range:12,restChance:.25};
// everyone strolls except characters tied to a spot or a cutscene; quest givers stay close to home so they're easy to find
const STAY_PUT=['elder','coach','bonnie','puffy','fluff','whiskers','ironpaw','tilly','figgy','barnaby'];
function initWalkers(){
  for(const n of NPCS){ if(STAY_PUT.includes(n.id)) continue; const chatter=!!WALKERS[n.id]; n.walker=true; n.range=chatter?WALK.range:4; n.speed=chatter?WALK.speed:30; if(n.ci==null) n.ci=0; }
  for(const n of NPCS) if(n.walker){ n.px=n.hx=n.x*16+8; n.py=n.hy=n.y*16+12; n.vx=n.vy=0; n.wt=Math.random()*2; n.anim=0; n.face=0; n.home=reg[I(n.x,n.y)]; } }
function walkerFree(x,y,n){
  for(const [cx,cy] of [[x-5,y-5],[x+5,y-5],[x-5,y],[x+5,y]]){ const tx=Math.floor(cx/16), ty=Math.floor(cy/16); if(!inb(tx,ty)) return false; const i=I(tx,ty);
    if(GSOLID[ground[i]]||OSOLID[obj[i]]||obj[i]===O.WARP||reg[i]!==n.home) return false; }
  if(Math.abs(x-P.x)<13&&Math.abs(y-P.y)<9) return false;
  for(const m of NPCS){ if(m===n||!npcVisible(m)) continue; const [mx,my]=npcPos(m.id); if(Math.abs(x-mx)<14&&Math.abs(y-my)<10) return false; }
  return true;
}
function updateWalkers(dt){
  for(const n of NPCS){ if(!n.walker||n.px==null) continue;
    if(Math.abs(n.px-P.x)>VW*1.5||Math.abs(n.py-P.y)>VH*1.5) continue;
    n.wt-=dt;
    if(n.wt<=0){
      if(Math.random()<WALK.restChance){ n.vx=n.vy=0; n.wt=.8+Math.random()*1.4; }
      else { let a=Math.random()*Math.PI*2; if(Math.hypot(n.hx-n.px,n.hy-n.py)>n.range*16) a=Math.atan2(n.hy-n.py,n.hx-n.px)+(Math.random()-.5);
        n.vx=Math.cos(a)*n.speed; n.vy=Math.sin(a)*n.speed; n.wt=2+Math.random()*2.5; n.face=n.vx<0?2:3; } }
    if(n.vx||n.vy){ const nx=n.px+n.vx*dt, ny=n.py+n.vy*dt; if(walkerFree(nx,ny,n)){ n.px=nx; n.py=ny; n.anim+=dt*6; } else { n.vx=n.vy=0; n.wt=.4; } }
  }
}

// =====================================================================
//  SAVE CODES — copy a code on one device, paste it on another to keep playing
// =====================================================================
// A code is "REX1." + the save squeezed with zlib deflate and written in base64url letters.
// zlib's checksum makes a code that was cut short or mistyped fail cleanly instead of loading junk.
// Browsers without CompressionStream make "REX0." codes (the save as plain text) instead.
let codeOpen=false, codeView='main', codePending=null;
const $c=id=>document.getElementById(id);
function b64url(bytes){ let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(str){ const s=atob(str.replace(/-/g,'+').replace(/_/g,'/')); const out=new Uint8Array(s.length); for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i); return out; }
async function pipeBytes(bytes,stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function makeSaveCode(obj){
  const json=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==='function') return 'REX1.'+b64url(await pipeBytes(json,new CompressionStream('deflate')));
  return 'REX0.'+b64url(json);
}
// returns {save} or {err} with a message for the player
async function readSaveCode(code){
  const m=/^REX([01])\.([A-Za-z0-9_-]+)$/i.exec(String(code).replace(/\s+/g,''));
  const bad="That code didn't work. Make sure you copied the whole code, from REX to the very end.";
  if(!m) return {err:bad};
  if(m[1]==='1'&&typeof DecompressionStream!=='function') return {err:"This browser is too old to read save codes. Try a newer browser."};
  try{
    let bytes=unb64url(m[2]);
    if(m[1]==='1') bytes=await pipeBytes(bytes,new DecompressionStream('deflate'));
    const s=JSON.parse(new TextDecoder().decode(bytes)), num=v=>typeof v==='number'&&isFinite(v);
    if(!s||typeof s!=='object'||!num(s.lvl)||!num(s.main)||!num(s.hp)||!s.q||typeof s.q!=='object') return {err:bad};
    return {save:s};
  }catch(e){ return {err:bad}; }
}
function writeLocalSave(obj){ memSave=JSON.stringify(obj); try{ localStorage.setItem(SAVE_KEY,memSave); }catch(e){} hasSave=true; }
function saveSummary(s){ const done=QUESTS.filter(q=>s.q&&s.q[q.id]&&s.q[q.id].st==='done').length; return 'level '+(s.lvl||1)+', '+done+(done===1?' quest':' quests')+' done'; }
function codeMsg(t){ $c('code-msg').textContent=t||''; }
function codeShow(view){
  codeView=view;
  document.querySelectorAll('#codebox [data-view]').forEach(el=>el.hidden=el.dataset.view!==view);
  document.querySelector('#codebox .code-close').hidden=view==='confirm';
}
function openSaveCode(){
  codeOpen=true; codePending=null; codeMsg(''); codeShow('main');
  const out=$c('code-out'), copy=document.querySelector('#codebox [data-act="copy"]'), share=document.querySelector('#codebox [data-act="share"]');
  out.value=''; out.hidden=true; $c('code-in').value=''; copy.disabled=share.disabled=true;
  $c('codebox').hidden=false; for(const k in keys) keys[k]=false;
  if(S) save(); const data=loadSave();
  // the code is made as soon as the box opens, so Copy and Share can run right inside the tap (Safari requires that)
  if(!data) codeMsg("There's no saved game on this device yet. Start an adventure first, then come back for your code.");
  else makeSaveCode(data).then(code=>{ if(!codeOpen) return; out.value=code; out.hidden=false; copy.disabled=share.disabled=false; });
  setTimeout(()=>{ const f=data?copy:$c('code-in'); if(f&&!f.disabled) f.focus(); else $c('code-in').focus(); },30);
}
function closeSaveCode(){
  if(codeView==='confirm'){ codePending=null; codeShow('main'); codeMsg(''); return; }
  codeOpen=false; $c('codebox').hidden=true; cv.focus&&cv.focus();
}
function selectCode(){ const out=$c('code-out'); out.focus(); out.select(); out.setSelectionRange(0,out.value.length); }
function loadFromCode(s){
  writeLocalSave(s); codeOpen=false; codePending=null; $c('codebox').hidden=true; codeShow('main');
  resetRun(); initAudio(); startGame(false); SFX.quest(); toast('Loaded your save code!','#8af08a');
}
async function codeAction(act){
  const code=$c('code-out').value;
  if(act==='close') return closeSaveCode();
  if(act==='cancel'){ codePending=null; codeShow('main'); codeMsg(''); return; }
  if(act==='copy'&&code){
    const done=ok=>{ codeMsg(ok?'Copied! On the other device, open Good Boy Rex, choose Save Code and paste it.':'Press and hold the code to copy it.'); if(!ok) selectCode(); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>done(true),()=>{ selectCode(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} done(ok); });
    else { selectCode(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} done(ok); }
    return; }
  if(act==='share'&&code){
    try{ await navigator.share({title:'Good Boy Rex save code',text:code}); codeMsg('Sent! On the other device, open Good Boy Rex, choose Save Code and paste it.'); }
    catch(e){ if(!e||e.name!=='AbortError') codeMsg("Couldn't share. Use Copy my code instead."); }
    return; }
  if(act==='load'){
    const raw=$c('code-in').value; if(!raw.trim()){ codeMsg('Paste a save code in the box first.'); $c('code-in').focus(); return; }
    const res=await readSaveCode(raw); if(res.err){ codeMsg(res.err); return; }
    const cur=S||loadSave();
    if(!cur){ loadFromCode(res.save); return; }
    codePending=res.save; codeMsg('');
    $c('code-confirm-text').textContent='This replaces the game on this device ('+saveSummary(cur)+') with the game from the code ('+saveSummary(res.save)+'). Load it?';
    codeShow('confirm'); const y=document.querySelector('#codebox [data-act="replace"]'); if(y) y.focus(); return; }
  if(act==='replace'&&codePending) loadFromCode(codePending);
}

const WAYPOINTS=[
  {r:R.VILLAGE,name:'Barkton Village',at:[96,104]},
  {r:R.KEEP,name:'Whisker Keep',at:[74,116]},
  {r:R.MEADOW,name:'Waggle Meadows',at:[97,62]},
  {r:R.WOODS,name:'Whispering Woods',at:[46,91]},
  {r:R.SHORE,name:'Sunny Shore',at:[140,110]},

  {r:R.CAVERNS,name:'Ember Caverns',at:[134,52]},
];
const WP_BY_REGION={}; WAYPOINTS.forEach(w=>WP_BY_REGION[w.r]=w);
function placeWaypoints(){
  // nudge each travel stone onto the nearest open, reachable tile with nobody standing on it
  const taken=new Set(NPCS.map(n=>n.x+','+n.y));
  for(const w of WAYPOINTS){ let best=null, bd=1e9;
    for(let y=w.at[1]-5;y<=w.at[1]+5;y++)for(let x=w.at[0]-5;x<=w.at[0]+5;x++){ if(!inb(x,y)) continue; const i=I(x,y);
      if(!reach[i]||GSOLID[ground[i]]||OSOLID[obj[i]]||obj[i]===O.WARP||taken.has(x+','+y)||taken.has(x+','+(y+1))) continue;
      if(GSOLID[ground[I(x,y+1)]]||OSOLID[obj[I(x,y+1)]]) continue;
      const d=Math.hypot(x-w.at[0],y-w.at[1]); if(d<bd){ bd=d; best=[x,y]; } }
    if(best) w.at=best; }
}
const wpUnlocked=w=>!!(S&&S.visited[w.r]);
function openTravel(){
  if(bossActive){ toast("You can't fast travel during a boss fight!",'#ff9a9a'); return; }
  const items=WAYPOINTS.map(w=>wpUnlocked(w)?{label:w.name,pick(){ travelTo(w); }}:{label:'??? (not found yet)',dis:true,pick(){ toast('Explore more of the island to unlock this place.'); }});
  items.push({label:'Cancel',pick(){}});
  menu={title:'Fast travel',choice:true,sel:0,items}; mode='menu';
}
function travelTo(w){ warpTo([w.at[0],w.at[1]+1],0,()=>toast('Welcome to '+w.name+'!','#9ad8ff')); }
function waypointNearRex(){ if(pZone()!==0) return null; for(const w of WAYPOINTS){ if(Math.hypot(P.x-(w.at[0]*16+8),(P.y-6)-(w.at[1]*16+8))<22) return w; } return null; }
function drawWaypoints(){
  if(pZone()!==0) return;
  for(const w of WAYPOINTS){ const x=w.at[0]*16-camX, y=w.at[1]*16-camY; if(x<-20||x>VW+20||y<-30||y>VH+20) continue;
    const on=wpUnlocked(w), glow=on?.35+.2*Math.sin(T*3):0;
    ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(x+3,y+13,10,3);
    rect(ctx,x+2,y+10,12,5,'#4a4858'); rect(ctx,x+3,y+10,10,2,'#8a8898');
    rect(ctx,x+5,y+1,6,10,'#1a2a4a'); rect(ctx,x+6,y+2,4,8,on?'#6ac8ff':'#5a6a80'); rect(ctx,x+6,y+2,1,5,on?'#d8f4ff':'#8a9ab0');
    if(on){ ctx.globalAlpha=glow; ctx.fillStyle='#8ad8ff'; ctx.beginPath(); ctx.arc(x+8,y+6,9,0,7); ctx.fill(); ctx.globalAlpha=1; } }
}

let lastT=0;
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000||0); lastT=t;
  try{ update(dt); render(); }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
function boot(){
  loadSettings();
  applySeason(); genWorld(); initWalkers(); placeWaypoints(); genTiles(); genThemeTiles(); genObjects(); genObjects2(); genThemeObjects(); buildMinimap();
  P.x=96*16; P.y=100*16;

}
